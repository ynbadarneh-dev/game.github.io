<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحاكاة والتوعية المالية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #333;
        }

        .demo-badge {
            background-color: #dc3545;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
        }

        /* قسم تسجيل الدخول */
        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background-color: #121212;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-action {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* الواجهة الرئيسية بعد الدخول */
        .dashboard {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 12px 15px;
            border-radius: 12px;
        }

        .balance-amount {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        /* قسم شام كاش (إيداع وسحب) */
        .banking-box {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #3d3d3d;
        }

        .sham-title {
            font-size: 13px;
            color: #f39c12;
            font-weight: bold;
        }

        .bank-btns {
            display: flex;
            gap: 10px;
        }

        .btn-deposit {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .btn-withdraw {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        /* لعبة العجلة والطمع */
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 10px auto;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ffcc00;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
        }

        .bet-multipliers {
            display: flex;
            gap: 5px;
        }

        .btn-multiplier {
            flex: 1;
            background-color: #333;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #ffcc00;
            font-size: 12px;
        }

        .btn-multiplier.active {
            border-color: #e74c3c;
            background-color: #4a1515;
        }

        .btn-spin {
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .result-box {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            min-height: 40px;
        }

        .result-box.loss { color: #e74c3c; }
        .result-box.win { color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <div class="demo-badge">⚠️ محاكاة توعوية - كشف آليات فخ الخسارة والطمع</div>

    <!-- 1. صفحة تسجيل الدخول -->
    <div id="login-section" class="login-box">
        <h3 style="text-align: center;">تسجيل الدخول للمنصة</h3>
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم / رقم الهاتف">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
        <button class="btn-action" onclick="login()">دخول</button>
    </div>

    <!-- 2. الواجهة الرئيسية (تظهر بعد الدخول) -->
    <div id="dashboard-section" class="dashboard">
        
        <div class="header">
            <div>
                <div style="font-size: 11px; color: #aaa;">الرصيد الحالي</div>
                <div class="balance-amount" id="balance">$ 100.00</div>
            </div>
            <button style="background:none; border:none; color:#e74c3c; cursor:pointer;" onclick="logout()">خروج</button>
        </div>

        <!-- قسم عمليات شام كاش (إيداع وسحب بقيم متغيرة) -->
        <div class="banking-box">
            <div class="sham-title">💳 بنك Sham Cash (شام كاش)</div>
            <input type="number" id="bank-amount" class="input-field" placeholder="أدخل المبلغ ($)" min="1" value="10">
            <div class="bank-btns">
                <button class="btn-deposit" onclick="handleDeposit()">إيداع</button>
                <button class="btn-withdraw" onclick="handleWithdraw()">سحب</button>
            </div>
        </div>

        <!-- قسم العجلة (فخ الطمع) -->
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="250" height="250"></canvas>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="font-size: 12px; color: #aaa;">مبلغ الرهان (من الرصيد):</div>
            <input type="number" id="bet-amount" class="input-field" value="10" min="1" oninput="resetMultipliers()">
            
            <div style="font-size: 11px; color: #aaa;">أزرار الطمع والمضاعفات (تزيد فخ الخسارة 5/6):</div>
            <div class="bet-multipliers">
                <button class="btn-multiplier" id="m2" onclick="setMultiplier(2, 'm2')">x2</button>
                <button class="btn-multiplier" id="m4" onclick="setMultiplier(4, 'm4')">x4</button>
                <button class="btn-multiplier" id="m6" onclick="setMultiplier(6, 'm6')">x6</button>
                <button class="btn-multiplier" id="m10" onclick="setMultiplier(10, 'm10')">x10</button>
            </div>

            <button class="btn-spin" id="spin-btn" onclick="spinWheel()">ادُر العجلة</button>
        </div>

        <div class="result-box" id="result-box">
            أدخل الرهان واضغط ادُر العجلة
        </div>

    </div>
</div>

<script>
    let balance = 100.00;
    let isSpinning = false;
    let isMultiplierActive = false;

    // قطاعات العجلة
    const sectors = [
        { label: '5%', type: 'win', percentage: 5, color: '#8e44ad', weight: 0.5 },
        { label: '10%', type: 'win', percentage: 10, color: '#27ae60', weight: 0.35 },
        { label: 'حظاً أوفر', type: 'loss', percentage: 0, color: '#7f8c8d', weight: 0.14 },
        { label: '200%', type: 'win', percentage: 200, color: '#e67e22', weight: 0.01 }
    ];

    // 1. تسجيل الدخول
    function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user && pass) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'flex';
            drawWheel();
            updateBalance();
        } else {
            alert('يرجى إدخال اسم المستخدم وكلمة المرور');
        }
    }

    function logout() {
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'flex';
    }

    // 2. معالجة الإيداع والسحب عبر شام كاش بناءً على القيمة المدخلة في المربع
    function handleDeposit() {
        const amountInput = document.getElementById('bank-amount');
        const val = parseFloat(amountInput.value);

        if (isNaN(val) || val <= 0) {
            alert('يرجى إدخال مبلغ صحيح للإيداع.');
            return;
        }

        balance += val;
        updateBalance();
        alert(`تم إيداع $${val.toFixed(2)} عبر شام كاش بنجاح.`);
    }

    function handleWithdraw() {
        const amountInput = document.getElementById('bank-amount');
        const val = parseFloat(amountInput.value);

        if (isNaN(val) || val <= 0) {
            alert('يرجى إدخال مبلغ صحيح للسحب.');
            return;
        }

        if (val > balance) {
            alert('رصيدك غير كافٍ لإجراء السحب!');
            return;
        }

        balance -= val;
        updateBalance();
        alert(`تم سحب $${val.toFixed(2)} إلى حساب شام كاش بنجاح.`);
    }

    function updateBalance() {
        document.getElementById('balance').innerText = `$ ${balance.toFixed(2)}`;
    }

    // 3. خوارزمية العجلة والطمع
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;

    function drawWheel() {
        const radius = canvas.width / 2;
        const arc = (2 * Math.PI) / sectors.length;

        sectors.forEach((sector, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, angle, angle + arc);
            ctx.lineTo(radius, radius);
            ctx.fill();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Arial';
            ctx.fillText(sector.label, radius - 10, 4);
            ctx.restore();
        });
    }

    function setMultiplier(factor, btnId) {
        resetMultipliers();
        const betInput = document.getElementById('bet-amount');
        betInput.value = 10 * factor;
        isMultiplierActive = true;
        document.getElementById(btnId).classList.add('active');
    }

    function resetMultipliers() {
        isMultiplierActive = false;
        document.querySelectorAll('.btn-multiplier').forEach(b => b.classList.remove('active'));
    }

    function spinWheel() {
        if (isSpinning) return;

        const betVal = parseFloat(document.getElementById('bet-amount').value);

        if (isNaN(betVal) || betVal <= 0) {
            alert('أدخل مبلغ رهان صحيح.');
            return;
        }

        if (betVal > balance) {
            alert('رصيدك لا يكفي للرهان! قم بالإيداع عبر شام كاش.');
            return;
        }

        balance -= betVal;
        updateBalance();

        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        // خوارزمية الطمع: عند استخدام أزرار المضاعفة يكون احتمال الخسارة 5 من أصل 6 (83.3%)
        let targetIndex;
        if (isMultiplierActive && Math.random() < (5 / 6)) {
            targetIndex = 2; // مؤشر "حظاً أوفر"
        } else {
            // اختيار عشوائي موزون (ربح القليل)
            targetIndex = Math.random() < 0.8 ? 0 : 1;
        }

        const sectorDegree = 360 / sectors.length;
        const targetCenterDegree = (targetIndex * sectorDegree) + (sectorDegree / 2);
        const spins = 360 * 5;
        const degreesToStop = spins + (360 - targetCenterDegree) - 90;

        currentRotation += (degreesToStop - (currentRotation % 360));
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            const resBox = document.getElementById('result-box');

            if (sectors[targetIndex].type === 'loss') {
                resBox.className = 'result-box loss';
                resBox.innerText = `🚨 خسرت الرهان ($${betVal.toFixed(2)})! طمع المضاعفات أدى لخسارتك.`;
            } else {
                const profit = (betVal * sectors[targetIndex].percentage) / 100;
                balance += betVal + profit;
                resBox.className = 'result-box win';
                resBox.innerText = `🎉 ربحت الفتات (${sectors[targetIndex].label}) +$${profit.toFixed(2)}`;
            }

            resetMultipliers();
            updateBalance();
        }, 4000);
    }
</script>

</body>
</html>
